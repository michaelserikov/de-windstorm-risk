[project]
name = "windrisk"
version = "0.1.0"
description = "German windstorm risk from open data: DWD station gusts, loss index, extreme value statistics and insurance loss metrics"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
